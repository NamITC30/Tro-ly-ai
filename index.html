<script>


  /* =========================================================
     DIFY
     ========================================================= */


  const DIFY_API_KEY =
    "DÁN_API_KEY_DIFY_VÀO_ĐÂY";


  const DIFY_API_URL =
    "https://academics-beautifully-learners-absence.trycloudflare.com/v1/chat-messages";


  /* =========================================================
     STATE
     ========================================================= */

  let conversationId = "";

  let isSending = false;


  /* =========================================================
     DOM
     ========================================================= */

  const chatArea =
    document.getElementById("chatArea");

  const chatContent =
    document.getElementById("chatContent");

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const newChatBtn =
    document.getElementById("newChatBtn");


  /* =========================================================
     AUTO RESIZE
     ========================================================= */

  messageInput.addEventListener(
    "input",
    () => {

      messageInput.style.height =
        "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          145
        ) + "px";

    }
  );


  /* =========================================================
     ENTER SEND
     ========================================================= */

  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =========================================================
     QUICK ACTIONS
     ========================================================= */

  function attachQuickActions() {

    document
      .querySelectorAll(".quick-action")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const message =
              button.dataset.message || "";

            messageInput.value =
              message;

            messageInput.dispatchEvent(
              new Event("input")
            );

            sendMessage();

          }
        );

      });

  }


  attachQuickActions();


  /* =========================================================
     NEW CHAT
     ========================================================= */

  newChatBtn.addEventListener(
    "click",
    () => {

      conversationId = "";

      location.reload();

    }
  );


  /* =========================================================
     ADD MESSAGE
     ========================================================= */

  function addMessage(
    role,
    text
  ) {

    const message =
      document.createElement("div");

    message.className =
      `message ${role}`;


    const row =
      document.createElement("div");

    row.className =
      "message-row";


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";


    if (
      role === "ai"
    ) {

      avatar.innerHTML = `

        <img
          src="./SW.jpg"
          alt="SEWON VINA">

      `;

    } else {

      avatar.classList.add(
        "user-avatar"
      );

      avatar.textContent =
        "👤";

    }


    const bubbleWrap =
      document.createElement("div");

    bubbleWrap.className =
      "bubble-wrap";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      text;


    const time =
      document.createElement("div");

    time.className =
      "message-time";

    time.textContent =
      currentTime();


    bubbleWrap.appendChild(
      bubble
    );

    bubbleWrap.appendChild(
      time
    );


    row.appendChild(
      avatar
    );

    row.appendChild(
      bubbleWrap
    );


    message.appendChild(
      row
    );


    chatContent.appendChild(
      message
    );


    scrollToBottom();


    return bubble;

  }


  /* =========================================================
     TYPING
     ========================================================= */

  function addTypingMessage() {

    const message =
      document.createElement("div");

    message.className =
      "message ai";


    const row =
      document.createElement("div");

    row.className =
      "message-row";


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";


    avatar.innerHTML = `

      <img
        src="./SW.jpg"
        alt="SEWON VINA">

    `;


    const bubbleWrap =
      document.createElement("div");

    bubbleWrap.className =
      "bubble-wrap";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    bubble.innerHTML = `

      <div class="typing">

        <span></span>
        <span></span>
        <span></span>

      </div>

    `;


    bubbleWrap.appendChild(
      bubble
    );


    row.appendChild(
      avatar
    );

    row.appendChild(
      bubbleWrap
    );


    message.appendChild(
      row
    );


    chatContent.appendChild(
      message
    );


    scrollToBottom();


    return bubble;

  }


  /* =========================================================
     SEND MESSAGE
     ========================================================= */

  async function sendMessage() {


    if (
      isSending
    ) {

      return;

    }


    const query =
      messageInput.value.trim();


    if (!query) {

      return;

    }


    if (
      DIFY_API_KEY ===
      "app-SyULax2Wzgg5fFfPkw11wDWm"
    ) {

      alert(
        "Bạn chưa nhập Dify API Key."
      );

      return;

    }


    isSending =
      true;

    sendBtn.disabled =
      true;


    /* USER */

    addMessage(
      "user",
      query
    );


    /* CLEAR */

    messageInput.value =
      "";

    messageInput.style.height =
      "auto";


    /* TYPING */

    const typingBubble =
      addTypingMessage();


    try {


      const response =
        await fetch(
          DIFY_API_URL,
          {

            method:
              "POST",

            headers: {

              "Authorization":
                "Bearer " +
                DIFY_API_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                inputs:
                  {},

                query:
                  query,

                response_mode:
                  "blocking",

                conversation_id:
                  conversationId,

                user:
                  "sewon-vina-user"

              })

          }
        );


      /* ERROR */

      if (
        !response.ok
      ) {

        const errorText =
          await response.text();

        console.error(
          "DIFY ERROR:",
          errorText
        );

        throw new Error(
          errorText ||
          `HTTP ${response.status}`
        );

      }


      /* JSON */

      const data =
        await response.json();


      /* ANSWER */

      let answer =
        data.answer || "";


      /*
       * REMOVE THINK
       */

      answer =
        removeThinking(
          answer
        );


      if (!answer) {

        answer =
          "Tôi chưa nhận được câu trả lời.";

      }


      typingBubble.textContent =
        answer;


      /* CONVERSATION */

      if (
        data.conversation_id
      ) {

        conversationId =
          data.conversation_id;

      }


    } catch (error) {


      console.error(
        "CHAT ERROR:",
        error
      );


      typingBubble.textContent =
        "Xin lỗi, hiện tại tôi không thể kết nối với Trợ lý AI.";


      typingBubble.classList.add(
        "error-bubble"
      );

    }


    isSending =
      false;

    sendBtn.disabled =
      false;

    messageInput.focus();

    scrollToBottom();

  }


  /* =========================================================
     REMOVE THINK
     ========================================================= */

  function removeThinking(
    text
  ) {

    if (!text) {

      return "";

    }


    text =
      text.replace(
        /<think>[\s\S]*?<\/think>/gi,
        ""
      );


    text =
      text.replace(
        /<think>[\s\S]*/gi,
        ""
      );


    return text.trim();

  }


  /* =========================================================
     TIME
     ========================================================= */

  function currentTime() {

    return new Date()
      .toLocaleTimeString(
        "vi-VN",
        {
          hour:
            "2-digit",

          minute:
            "2-digit"
        }
      );

  }


  /* =========================================================
     SCROLL
     ========================================================= */

  function scrollToBottom() {

    requestAnimationFrame(
      () => {

        chatArea.scrollTop =
          chatArea.scrollHeight;

      }
    );

  }


  /* =========================================================
     START
     ========================================================= */

  messageInput.focus();


</script>
