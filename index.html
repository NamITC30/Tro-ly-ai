    @keyframes typing {

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="brand">

      <div class="brand-icon">
        🤖
      </div>

      <div class="brand-text">

        <div class="brand-title">
          Trợ lý AI
        </div>

        <div class="brand-status">
          <span class="status-dot"></span>
          Đang hoạt động
        </div>

      </div>

    </div>

    <button
      class="new-chat-btn"
      id="newChatBtn">
      + Hội thoại mới
    </button>

  </header>


  <!-- CHAT AREA -->
  <main class="chat-area" id="chatArea">

    <div class="chat-content" id="chatContent">

      <section class="welcome" id="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h1>
          Xin chào! 👋
        </h1>

        <p>
          Tôi là Trợ lý AI. Hãy đặt câu hỏi hoặc chọn
          một gợi ý bên dưới để bắt đầu.
        </p>

        <div class="suggestions">

          <button class="suggestion">
            Tôi có thể hỏi bạn những gì?
          </button>

          <button class="suggestion">
            Hãy giới thiệu về bạn
          </button>

          <button class="suggestion">
            Giúp tôi tìm thông tin
          </button>

          <button class="suggestion">
            Hướng dẫn tôi sử dụng hệ thống
          </button>

        </div>

      </section>

    </div>

  </main>


  <!-- INPUT -->
  <section class="composer-wrap">

    <div class="composer">

      <div class="input-box">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Nhập câu hỏi của bạn..."
          autocomplete="off"></textarea>

        <button
          class="send-btn"
          id="sendBtn"
          title="Gửi">
          ➤
        </button>

      </div>

      <div class="disclaimer">
        Trợ lý AI có thể đưa ra thông tin chưa chính xác.
      </div>

    </div>

  </section>

</div>


<script>

  /*
   * ============================================================
   * 1. DÁN API KEY CỦA BẠN VÀO ĐÂY
   * ============================================================
   *
   * KHÔNG gửi API Key này cho tôi.
   */

  const DIFY_API_KEY ="app-SyULax2Wzgg5fFfPkw11wDWm";
    "DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY";


  /*
   * ============================================================
   * 2. URL DIFY QUA CLOUDFLARE TUNNEL
   * ============================================================
   */

  const DIFY_API_URL =
    "https://academics-beautifully-learners-absence.trycloudflare.com/v1/chat-messages";


  /*
   * ============================================================
   * 3. BIẾN HỘI THOẠI
   * ============================================================
   */

  let conversationId = "";

  let isSending = false;


  /*
   * ============================================================
   * 4. DOM
   * ============================================================
   */

  const chatArea =
    document.getElementById("chatArea");

  const chatContent =
    document.getElementById("chatContent");

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const newChatBtn =
    document.getElementById("newChatBtn");


  /*
   * ============================================================
   * 5. AUTO RESIZE INPUT
   * ============================================================
   */

  messageInput.addEventListener(
    "input",
    () => {

      messageInput.style.height =
        "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          140
        ) + "px";

    }
  );


  /*
   * ============================================================
   * 6. ENTER ĐỂ GỬI
   * ============================================================
   */

  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /*
   * ============================================================
   * 7. GỢI Ý
   * ============================================================
   */

  function attachSuggestionEvents() {

    document
      .querySelectorAll(".suggestion")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            messageInput.value =
              button.textContent.trim();

            messageInput.dispatchEvent(
              new Event("input")
            );

            sendMessage();

          }
        );

      });

  }


  attachSuggestionEvents();


  /*
   * ============================================================
   * 8. HỘI THOẠI MỚI
   * ============================================================
   */

  newChatBtn.addEventListener(
    "click",
    () => {

      conversationId = "";

      chatContent.innerHTML = `
        <section class="welcome">

          <div class="welcome-icon">
            🤖
          </div>

          <h1>
            Xin chào! 👋
          </h1>

          <p>
            Tôi là Trợ lý AI. Hãy đặt câu hỏi hoặc chọn
            một gợi ý bên dưới để bắt đầu.
          </p>

          <div class="suggestions">

            <button class="suggestion">
              Tôi có thể hỏi bạn những gì?
            </button>

            <button class="suggestion">
              Hãy giới thiệu về bạn
            </button>

            <button class="suggestion">
              Giúp tôi tìm thông tin
            </button>

            <button class="suggestion">
              Hướng dẫn tôi sử dụng hệ thống
            </button>

          </div>

        </section>
      `;

      attachSuggestionEvents();

      messageInput.value = "";

      messageInput.style.height =
        "auto";

      messageInput.focus();

    }
  );


  /*
   * ============================================================
   * 9. THÊM TIN NHẮN
   * ============================================================
   */

  function addMessage(role, text) {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " + role;

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      text;

    wrapper.appendChild(bubble);

    chatContent.appendChild(wrapper);

    scrollToBottom();

    return bubble;
  }


  /*
   * ============================================================
   * 10. HIỆU ỨNG ĐANG TRẢ LỜI
   * ============================================================
   */

  function addTypingMessage() {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message ai";

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.innerHTML = `
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    `;

    wrapper.appendChild(bubble);

    chatContent.appendChild(wrapper);

    scrollToBottom();

    return bubble;

  }


  /*
   * ============================================================
   * 11. GỬI CÂU HỎI TỚI DIFY
   * ============================================================
   */

  async function sendMessage() {

    if (isSending) {
      return;
    }

    const query =
      messageInput.value.trim();

    if (!query) {
      return;
    }


    isSending = true;

    sendBtn.disabled = true;


    /*
     * Hiện câu hỏi của người dùng
     */

    addMessage(
      "user",
      query
    );


    /*
     * Xóa ô nhập
     */

    messageInput.value = "";

    messageInput.style.height =
      "auto";


    /*
     * Hiệu ứng đang trả lời
     */

    const typingBubble =
      addTypingMessage();


    try {

      const response =
        await fetch(
          DIFY_API_URL,
          {

            method: "POST",

            headers: {

              "Authorization":
                "Bearer " +
                DIFY_API_KEY,

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              inputs: {},

              query: query,

              response_mode:
                "blocking",

              conversation_id:
                conversationId,

              user:
                "github-pages-user"

            })

          }
        );


      /*
       * Kiểm tra HTTP
       */

      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          "DIFY ERROR:",
          errorText
        );

        throw new Error(
          errorText ||
          "Dify API error"
        );

      }


      /*
       * Đọc JSON
       */

      const data =
        await response.json();


      /*
       * Hiển thị câu trả lời
       */

      typingBubble.textContent =
        data.answer ||
        "Tôi chưa nhận được câu trả lời.";


      /*
       * Lưu conversation_id
       */

      if (
        data.conversation_id
      ) {

        conversationId =
          data.conversation_id;

      }


    } catch (error) {

      console.error(
        "CHAT ERROR:",
        error
      );

      typingBubble.textContent =
        "Xin lỗi, hiện tại không thể kết nối với Trợ lý AI.";

    }


    isSending = false;

    sendBtn.disabled = false;

    messageInput.focus();

    scrollToBottom();

  }


  /*
   * ============================================================
   * 12. SCROLL XUỐNG CUỐI
   * ============================================================
   */

  function scrollToBottom() {

    requestAnimationFrame(
      () => {

        chatArea.scrollTop =
          chatArea.scrollHeight;

      }
    );

  }


  /*
   * ============================================================
   * 13. FOCUS
   * ============================================================
   */

  messageInput.focus();

</script>

</body>
</html>
