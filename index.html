<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">

  <title>Trợ lý AI SEWON</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f9ff;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 70px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .header img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 10px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .messages {
      max-width: 800px;
      margin: auto;
    }

    .message {
      margin: 12px 0;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
    }

    .ai .bubble {
      background: white;
      border: 1px solid #e5e7eb;
      color: #1f2937;
    }

    .composer {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 12px;
    }

    .composer-inner {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 12px;
      outline: none;
    }

    button {
      width: 44px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div class="header">
    <img src="./SW.jpg" alt="SEWON VINA">
    <div class="title">Trợ lý AI</div>
  </div>

  <div class="chat">
    <div class="messages" id="messages">
      <div class="message ai">
        <div class="bubble">
          Xin chào! Tôi là Trợ lý AI của SEWON VINA. Tôi có thể giúp gì cho bạn?
        </div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">

      <textarea
        id="input"
        placeholder="Nhập câu hỏi..."
        autocomplete="off"
      ></textarea>

      <button id="send">➤</button>

    </div>
  </div>

<script>

  /* ============================
     DIFY CONFIG
     ============================ */

  const DIFY_API_KEY =
    "DÁN_API_KEY_CỦA_BẠN";

  const DIFY_API_URL =
    "https://academics-beautifully-learners-absence.trycloudflare.com/v1/chat-messages";


  /* ============================
     STATE
     ============================ */

  let conversationId = "";


  const input =
    document.getElementById("input");

  const send =
    document.getElementById("send");

  const messages =
    document.getElementById("messages");


  /* ============================
     ADD MESSAGE
     ============================ */

  function addMessage(
    type,
    text
  ) {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " + type;

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      text;

    wrapper.appendChild(
      bubble
    );

    messages.appendChild(
      wrapper
    );

    document
      .querySelector(".chat")
      .scrollTop =
      document
        .querySelector(".chat")
        .scrollHeight;

    return bubble;
  }


  /* ============================
     SEND MESSAGE
     ============================ */

  async function sendMessage() {

    const query =
      input.value.trim();

    if (!query) {
      return;
    }

    send.disabled = true;

    addMessage(
      "user",
      query
    );

    input.value = "";


    const answerBubble =
      addMessage(
        "ai",
        "Đang trả lời..."
      );


    try {

      const response =
        await fetch(
          DIFY_API_URL,
          {
            method: "POST",

            headers: {
              "Authorization":
                "Bearer " +
                DIFY_API_KEY,

              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                inputs: {},

                query: query,

                response_mode:
                  "blocking",

                conversation_id:
                  conversationId,

                user:
                  "sewon-vina-user"

              })
          }
        );


      const raw =
        await response.text();


      console.log(
        "HTTP STATUS:",
        response.status
      );

      console.log(
        "DIFY RESPONSE:",
        raw
      );


      if (!response.ok) {

        answerBubble.textContent =
          "Dify trả lỗi HTTP " +
          response.status;

        console.error(raw);

        return;
      }


      let data;

      try {

        data =
          JSON.parse(raw);

      } catch {

        answerBubble.textContent =
          "Dify không trả JSON hợp lệ.";

        return;
      }


      let answer =
        data.answer || "";


      /*
       * Xóa <think>...</think>
       */

      answer =
        answer.replace(
          /<think>[\s\S]*?<\/think>/gi,
          ""
        );


      answer =
        answer.replace(
          /<think>[\s\S]*/gi,
          ""
        );


      answer =
        answer.trim();


      answerBubble.textContent =
        answer ||
        "Dify không trả nội dung.";


      if (
        data.conversation_id
      ) {

        conversationId =
          data.conversation_id;

      }


    } catch (error) {

      console.error(
        "FETCH ERROR:",
        error
      );

      answerBubble.textContent =
        "Không thể kết nối Dify.";

    }


    send.disabled = false;

    input.focus();

  }


  send.addEventListener(
    "click",
    sendMessage
  );


  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );

</script>

</body>
</html>
