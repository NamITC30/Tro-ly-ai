```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Trợ lý AI</title>

  <style>
    /* ==============================
       RESET
       ============================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f7fb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    /* ==============================
       CONTAINER FULLSCREEN
       ============================== */

    .chat-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    /* ==============================
       DIFY CHATBOT
       ============================== */

    .chat-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      border: 0;
      outline: none;
    }

    /* ==============================
       MOBILE
       ============================== */

    @media (max-width: 768px) {
      .chat-container {
        width: 100%;
        height: 100dvh;
      }

      .chat-container iframe {
        height: 100dvh;
        min-height: 100dvh;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <iframe
      src="https://academics-beautifully-learners-absence.trycloudflare.com/chatbot/ZJt6h8EZOpMf9dey"
      title="Trợ lý AI"
      allow="microphone; clipboard-write"
      loading="eager">
    </iframe>

  </div>

</body>
</html>
