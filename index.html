<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trợ lý AI</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        #kommunicate {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="kommunicate"></div>

<script type="text/javascript">

(function(d, m) {

    var kommunicateSettings = {
        "appId": "1d981135619597893192944adeec641a4",

        /*
         * Không dùng popup chat nhỏ ở góc
         */
        "popupWidget": false,

        /*
         * Hiển thị Kommunicate trong toàn bộ trang
         */
        "containerId": "kommunicate",

        /*
         * Tự động mở hội thoại
         */
        "automaticChatOpenOnNavigation": true,

        /*
         * Việt hóa giao diện
         */
        "customLabelLocales": {

            "vi": {

                "input.message": "Nhập tin nhắn...",

                "conversations.title": "Hội thoại",

                "start.new": "Bắt đầu hội thoại mới",

                "empty.messages": "Chưa có tin nhắn",

                "empty.conversations": "Chưa có hội thoại",

                "search.placeholder": "Tìm kiếm...",

                "members.title": "Thành viên",

                "typing": "đang nhập...",

                "is.typing": "đang nhập...",

                "online": "Trực tuyến",

                "offline": "Ngoại tuyến",

                "clear.messages": "Xóa tin nhắn",

                "delete": "Xóa"
            }
        }
    };

    var s = document.createElement("script");

    s.type = "text/javascript";

    s.async = true;

    s.src = "https://widget.kommunicate.io/kommunicate-widget-3.0.min.js";

    var h = document.getElementsByTagName("head")[0];

    h.appendChild(s);

    window.kommunicate = m;

    m._globals = kommunicateSettings;

})(document, window.kommunicate || {});

</script>

</body>
</html>
